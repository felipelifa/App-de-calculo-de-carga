<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Carga — App de Treino Inteligente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }
        .logo-box {
            width: 80px;
            height: 80px;
            background: #CCFF00;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            transform: rotate(12deg);
            box-shadow: 0 0 30px rgba(204, 255, 0, 0.2);
        }
        h1 {
            font-size: clamp(32px, 8vw, 48px);
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            text-align: center;
        }
        p {
            font-size: 18px;
            color: #a3a3a3;
            margin-bottom: 48px;
            line-height: 1.6;
            max-width: 450px;
            text-align: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 40px;
            background: #CCFF00;
            color: #000;
            font-weight: 900;
            border-radius: 16px;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(204, 255, 0, 0.4);
        }
        footer {
            margin-top: 60px;
            padding: 32px;
            text-align: center;
        }
        .footer-text {
            color: #525252;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 900;
        }
    </style>
</head>
<body>
    <div class="logo-box">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 6.5h11M6.5 17.5h11M3 10v4M21 10v4M5 8v8M19 8v8" />
        </svg>
    </div>

    <h1>TITAN ENGINE</h1>

    <p>
        Sistema de treinamento bio-adaptativo com prescrição inteligente, periodização DUP e controle real de carga.
    </p>

    <a href="/treino/" class="btn">
        ENTRAR
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
    </a>

    <footer>
        <p class="footer-text">© 2026 Titan Engine</p>
    </footer>
</body>
</html>
