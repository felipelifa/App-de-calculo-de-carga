[build]
  base = "app"
  command = "if [ ! -f ./flutter/bin/flutter ]; then rm -rf flutter && git clone https://github.com/flutter/flutter.git -b stable --depth 1; fi && ./flutter/bin/flutter config --enable-web && ./flutter/bin/flutter pub get && ./flutter/bin/flutter build web --release --web-renderer html"
  publish = "build/web"
